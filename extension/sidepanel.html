<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Video Transcriber</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">LVT</div>
      <div>
        <h1>Local Video Transcriber</h1>
        <p id="connection-status" role="status">尚未连接</p>
      </div>
    </header>
    <main>
      <section class="connection-section" aria-labelledby="connection-title">
        <div class="section-heading">
          <h2 id="connection-title">本地连接</h2>
          <span id="token-state" class="token-state">未保存 Token</span>
        </div>
        <form id="connection-form" novalidate>
          <div class="connection-fields">
            <label>
              <span>主机</span>
              <span class="fixed-host">127.0.0.1</span>
            </label>
            <label>
              <span>端口</span>
              <input
                id="connection-port"
                name="port"
                type="number"
                min="1"
                max="65535"
                step="1"
                inputmode="numeric"
                required
              />
            </label>
          </div>
          <label class="token-field">
            <span>配对 Token</span>
            <input
              id="connection-token"
              name="token"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="输入或替换 Token"
            />
          </label>
          <p id="connection-detail" class="connection-detail"></p>
          <div class="connection-actions">
            <button id="save-connection" type="submit">保存并连接</button>
            <button id="reconnect" type="button" class="secondary">重新连接</button>
            <button id="clear-token" type="button" class="danger">清除 Token</button>
          </div>
        </form>
      </section>
      <section class="submission-section" aria-labelledby="submission-title">
        <div class="section-heading">
          <h2 id="submission-title">批量提交</h2>
          <span id="url-count" class="input-summary">有效 0 / 无效 0</span>
        </div>
        <form id="job-form" novalidate>
          <label for="job-urls">
            <span>视频 URL</span>
            <textarea
              id="job-urls"
              name="urls"
              rows="5"
              spellcheck="false"
              placeholder="一行一个 HTTP 或 HTTPS URL"
            ></textarea>
          </label>
          <p id="url-limit" class="form-message" role="status"></p>
          <ol id="invalid-urls" class="validation-list" aria-label="无效 URL"></ol>
          <div class="job-options">
            <label for="asr-model">
              <span>ASR 模型</span>
              <input
                id="asr-model"
                name="asrModel"
                value="mlx-community/whisper-small-mlx"
                required
              />
            </label>
            <label>
              <span>目标语言</span>
              <span class="fixed-value">zh-CN</span>
            </label>
          </div>
          <label class="toggle-field" for="diarization">
            <input id="diarization" name="diarization" type="checkbox" checked />
            <span>识别说话人</span>
          </label>
          <div class="submission-actions">
            <button id="submit-jobs" type="submit" disabled>提交任务</button>
            <p id="submission-result" class="form-message" role="status"></p>
          </div>
          <ol id="server-rejections" class="validation-list" aria-label="后端拒绝的 URL"></ol>
        </form>
      </section>
      <section class="jobs-section" aria-labelledby="workspace-title">
        <div class="section-heading">
          <h2 id="workspace-title">任务</h2>
          <span id="job-count" class="input-summary">0 个</span>
        </div>
        <div id="job-filters" class="filter-tabs" role="tablist" aria-label="任务筛选">
          <button type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
          <button type="button" role="tab" data-filter="processing" aria-selected="false">
            处理中
          </button>
          <button type="button" role="tab" data-filter="completed" aria-selected="false">
            已完成
          </button>
          <button type="button" role="tab" data-filter="failed" aria-selected="false">失败</button>
        </div>
        <p id="jobs-empty" class="empty-state">尚未提交任务</p>
        <div id="job-list" class="job-list" aria-live="polite"></div>
      </section>
      <section id="job-detail" class="detail-section" aria-labelledby="detail-title" hidden>
        <div class="detail-header">
          <button id="detail-back" type="button" class="secondary">返回任务</button>
          <h2 id="detail-title">任务详情</h2>
        </div>
        <h3 id="detail-job-title" class="detail-job-title"></h3>
        <p id="detail-job-url" class="detail-job-url"></p>
        <dl class="detail-summary">
          <div>
            <dt>状态</dt>
            <dd id="detail-status"></dd>
          </div>
          <div>
            <dt>总进度</dt>
            <dd id="detail-overall-progress"></dd>
          </div>
          <div>
            <dt>阶段进度</dt>
            <dd id="detail-stage-progress"></dd>
          </div>
          <div>
            <dt>语言</dt>
            <dd id="detail-language"></dd>
          </div>
          <div>
            <dt>媒体时长</dt>
            <dd id="detail-duration"></dd>
          </div>
          <div>
            <dt>执行次数</dt>
            <dd id="detail-execution-count"></dd>
          </div>
          <div>
            <dt>Retry cycle</dt>
            <dd id="detail-retry-cycle"></dd>
          </div>
        </dl>
        <dl class="detail-options">
          <div>
            <dt>ASR 模型</dt>
            <dd id="detail-asr-model"></dd>
          </div>
          <div>
            <dt>目标语言</dt>
            <dd id="detail-translate-to"></dd>
          </div>
          <div>
            <dt>说话人识别</dt>
            <dd id="detail-diarization"></dd>
          </div>
        </dl>
        <div id="detail-actions" class="job-actions" aria-label="任务操作"></div>
        <p id="detail-action-message" class="action-message" role="status"></p>
        <section class="timeline-section" aria-labelledby="timeline-title">
          <div class="section-heading">
            <h3 id="timeline-title">事件时间线</h3>
            <span id="event-count" class="input-summary">0 条</span>
          </div>
          <p id="timeline-message" class="form-message" role="status"></p>
          <ol id="event-list" class="event-list"></ol>
          <button id="load-more-events" type="button" class="secondary" hidden>加载更多</button>
        </section>
      </section>
    </main>
    <dialog id="delete-dialog" aria-labelledby="delete-dialog-title">
      <div class="delete-dialog-content">
        <h2 id="delete-dialog-title">确认删除任务</h2>
        <p>删除后无法恢复：</p>
        <p id="delete-job-title" class="delete-job-title"></p>
        <p id="delete-error" class="action-message" role="status"></p>
        <div class="dialog-actions">
          <button id="delete-cancel" type="button" class="secondary">取消</button>
          <button id="delete-confirm" type="button" class="danger-solid">确认删除</button>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
